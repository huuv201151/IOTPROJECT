name: RainSense checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rainsense-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rainsense
      DEMO_MODE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client from the backend schema
        run: npm run prisma:generate --workspace=backend
      - run: npm test
      - name: Verify shared frontend modules are synchronized
        run: git diff --exit-code -- frontend/shared
      - run: npm run lint
      - name: Build backend and exported dashboard
        run: npm run build --workspace=backend
        env:
          RAINSENSE_RENDER_DASHBOARD: '1'
